stages:
  - test
  - automatic-mr
  - build
  - upload
  - release

image: ubuntu:20.04

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/$CI_PROJECT_ID/packages/generic/my_package/0.0.1/$CI_PROJECT_NAME-$CI_COMMIT_TAG.tgz"

before_script:
    - apt update && apt upgrade -y
    - DEBIAN_FRONTEND=noninteractive apt install -y make build-essential cmake g++ wget flex bison unzip python python3-pip iproute2 ninja-build pkg-config libpixman-1-dev libglib2.0-dev git wget curl libelf-dev libvirglrenderer-dev libepoxy-dev libgtk-3-dev libsdl2-dev
    - pip install pexpect pytruth gitlab-auto-mr gitpython
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@git.greensocs.com/".insteadOf "git@git.greensocs.com:"

build_make:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    - mkdir -p build
    - cmake -B build -DCMAKE_BUILD_TYPE=RELEASE -DCMAKE_INSTALL_PREFIX=BUILD/RELEASE -DCPM_DOWNLOAD_ALL=1 -DLIBQEMU_TARGETS=aarch64
    - cd build &&  make -j && make -j test

build_automatic_mr:
  stage: automatic-mr
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  script:
    - git clone git@git.greensocs.com:greensocs/cmake-boilerplate.git
    - cp cmake-boilerplate/automatic_mr.py ./
    - chmod +x automatic_mr.py
    - ./automatic_mr.py

build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - cmake -Bbuild -DCPM_SOURCE_CACHE=Packages -DGS_ONLY=True && rm -rf build
    - cd Packages && git clone git@git.greensocs.com:greensocs/cmake-boilerplate.git
    - /bin/sh ./cmake-boilerplate/tar_builder.sh $CI_PROJECT_DIR
    - cd ../../
    - tar --exclude-vcs -zcf $CI_PROJECT_NAME-$CI_COMMIT_TAG.tgz $CI_PROJECT_NAME
    - mv $CI_PROJECT_NAME-$CI_COMMIT_TAG.tgz $CI_PROJECT_NAME/
  artifacts:
    paths:
      - $CI_PROJECT_NAME-$CI_COMMIT_TAG.tgz

upload:
  stage: upload
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - 'curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file $CI_PROJECT_DIR/$CI_PROJECT_NAME-$CI_COMMIT_TAG.tgz "${CI_API_V4_URL}/projects/$CI_PROJECT_ID/packages/generic/my_package/0.0.1/$CI_PROJECT_NAME-$CI_COMMIT_TAG.tgz?status=default"'

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - curl -L --output /usr/local/bin/release-cli "https://release-cli-downloads.s3.amazonaws.com/latest/release-cli-linux-amd64"
    - chmod +x /usr/local/bin/release-cli
    - release-cli create --name "Release $CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" --assets-link "{\"name\":\"$CI_PROJECT_NAME-$CI_COMMIT_TAG.tgz\",\"url\":\"${PACKAGE_REGISTRY_URL}\"}"
